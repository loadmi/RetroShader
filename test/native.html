<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RetroShader native-video test</title>
  <style>
    body { margin: 16px; background: #15151b; color: #ddd; font: 14px system-ui; }
    video { display: block; width: 960px; max-width: 100%; background: #000; }
    button { margin: 8px 8px 8px 0; }
  </style>
</head>
<body>
  <p>Plain <code>&lt;video controls&gt;</code> with a native WebVTT track, like a generic site or a local file.</p>
  <video id="v" controls muted autoplay playsinline src="/test/captures/card-240p.webm">
    <track kind="subtitles" srclang="en" label="English" src="/test/subs.vtt" default>
  </video>
  <button id="fs">Fullscreen the bare &lt;video&gt;</button>
  <button id="loop">Restart</button>
  <script>window.__CRT_DEBUG__ = true;</script>
  <script src="/test/chrome-stub.js"></script>
  <script src="/extension/src/settings.js"></script>
  <script src="/extension/src/shaders.js"></script>
  <script src="/extension/src/renderer.js"></script>
  <script src="/extension/src/content.js"></script>
  <script>
    const v = document.getElementById('v');
    document.getElementById('fs').addEventListener('click', () => v.requestFullscreen());
    document.getElementById('loop').addEventListener('click', () => { v.currentTime = 0; v.play(); });
    v.addEventListener('ended', () => { v.currentTime = 0; v.play(); });
    window.crtStatus = () => chrome.tabs.sendMessage(1, { type: 'crt:status' });
  </script>
</body>
</html>
